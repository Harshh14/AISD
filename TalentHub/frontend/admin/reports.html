<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports – TalentHub Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="spinner" class="spinner-overlay"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><h2><i class="fas fa-shield-alt"></i> TalentHub</h2><span>Admin Portal</span></div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
        <div class="nav-section-label">Management</div>
        <a href="students.html" class="nav-link"><i class="fas fa-user-graduate"></i> Students</a>
        <a href="companies.html" class="nav-link"><i class="fas fa-building"></i> Companies</a>
        <a href="reports.html" class="nav-link active"><i class="fas fa-chart-bar"></i> Reports</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar" id="sidebar-avatar">A</div><div><div class="user-name" id="sidebar-user-name">Admin</div><div class="user-role" id="sidebar-user-role">Admin</div></div></div>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="top-bar"><h1>Placement Reports</h1></div>
      <div class="page-content">
        <!-- Summary Stats -->
        <div class="stats-grid" id="report-stats"></div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:4px;">
          <!-- Branch-wise -->
          <div class="card">
            <h3 style="margin-bottom:16px;color:var(--primary);"><i class="fas fa-chart-pie"></i> Branch-wise Placement</h3>
            <div class="table-container">
              <table>
                <thead><tr><th>Branch</th><th>Total</th><th>Placed</th><th>%</th><th>Avg CTC</th></tr></thead>
                <tbody id="branch-body"></tbody>
              </table>
            </div>
          </div>
          <!-- CTC summary -->
          <div class="card">
            <h3 style="margin-bottom:16px;color:var(--primary);"><i class="fas fa-money-bill-wave"></i> CTC Analysis</h3>
            <div id="ctc-stats"></div>
          </div>
        </div>

        <!-- Placed Students -->
        <div class="card" style="margin-top:24px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="color:var(--primary);"><i class="fas fa-trophy"></i> Placed Students</h3>
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="search" placeholder="Search placed students..."></div>
          </div>
          <div class="table-container">
            <table>
              <thead><tr><th>#</th><th>Student</th><th>Branch</th><th>CGPA</th><th>Company</th><th>Designation</th><th>CTC</th><th>Joining</th></tr></thead>
              <tbody id="placed-body"><tr><td colspan="8" style="text-align:center;color:var(--text-muted);">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script>
    requireAuth('admin'); renderSidebarUser();
    let allPlaced = [];

    const renderPlaced = (students) => {
      const body = document.getElementById('placed-body');
      if (!students.length) { body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);">No placed students yet.</td></tr>'; return; }
      body.innerHTML = students.map((s,i) => `<tr>
        <td>${i+1}</td>
        <td><strong>${s.student?.user?.name||'—'}</strong></td>
        <td>${s.student?.branch||'—'}</td>
        <td>${s.student?.cgpa??'—'}</td>
        <td>${s.company?.companyName||'—'}</td>
        <td>${s.designation||'—'}</td>
        <td style="font-weight:700;color:var(--success);">${formatCTC(s.ctc)}</td>
        <td>${formatDate(s.joiningDate)}</td>
      </tr>`).join('');
    };

    (async () => {
      showLoading();
      try {
        const [statsRes, placedRes] = await Promise.all([
          api('/reports/placement-statistics'),
          api('/reports/placed-students'),
        ]);
        const s = statsRes.data;

        // Summary stats
        document.getElementById('report-stats').innerHTML = `
          <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-users"></i></div><div class="stat-info"><h3>${s.totalStudents}</h3><p>Total Students</p></div></div>
          <div class="stat-card"><div class="stat-icon green"><i class="fas fa-trophy"></i></div><div class="stat-info"><h3>${s.placedStudents}</h3><p>Placed</p></div></div>
          <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-percent"></i></div><div class="stat-info"><h3>${s.placementPercentage}%</h3><p>Placement Rate</p></div></div>
          <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-building"></i></div><div class="stat-info"><h3>${s.companiesVisited}</h3><p>Companies Visited</p></div></div>
          <div class="stat-card"><div class="stat-icon gold"><i class="fas fa-money-bill-wave"></i></div><div class="stat-info"><h3>${formatCTC(s.avgCtc)}</h3><p>Avg CTC</p></div></div>
          <div class="stat-card"><div class="stat-icon red"><i class="fas fa-star"></i></div><div class="stat-info"><h3>${formatCTC(s.maxCtc)}</h3><p>Highest CTC</p></div></div>
        `;

        // Branch-wise table
        const branchBody = document.getElementById('branch-body');
        if (s.branchWisePlacement?.length) {
          branchBody.innerHTML = s.branchWisePlacement.map(b => `<tr>
            <td><strong>${b.branch}</strong></td>
            <td>${b.total}</td>
            <td>${b.placed}</td>
            <td><span style="font-weight:700;color:${b.percentage>=70?'var(--success)':b.percentage>=40?'var(--warning)':'var(--danger)'};">${b.percentage}%</span></td>
            <td>${formatCTC(b.avgCtc)}</td>
          </tr>`).join('');
        } else { branchBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">No data</td></tr>'; }

        // CTC stats
        document.getElementById('ctc-stats').innerHTML = `
          <div style="display:flex;flex-direction:column;gap:14px;">
            <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg);border-radius:8px;">
              <span style="color:var(--text-muted);">Average CTC</span>
              <strong style="color:var(--success);">${formatCTC(s.avgCtc)}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg);border-radius:8px;">
              <span style="color:var(--text-muted);">Highest CTC</span>
              <strong style="color:var(--success);">${formatCTC(s.maxCtc)}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg);border-radius:8px;">
              <span style="color:var(--text-muted);">Total Offers Issued</span>
              <strong>${s.offersIssued||0}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;padding:12px;background:var(--bg);border-radius:8px;">
              <span style="color:var(--text-muted);">Offers Accepted</span>
              <strong style="color:var(--success);">${s.offersAccepted||0}</strong>
            </div>
          </div>`;

        allPlaced = placedRes.data;
        renderPlaced(allPlaced);
      } catch(err) { showToast(err.message,'error'); }
      hideLoading();
    })();

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderPlaced(allPlaced.filter(s =>
        (s.student?.user?.name||'').toLowerCase().includes(q) ||
        (s.student?.branch||'').toLowerCase().includes(q) ||
        (s.company?.companyName||'').toLowerCase().includes(q)
      ));
    });
  </script>
</body>
</html>
