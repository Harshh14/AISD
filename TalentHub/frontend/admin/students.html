<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students – TalentHub Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="spinner" class="spinner-overlay"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><h2><i class="fas fa-shield-alt"></i> TalentHub</h2><span>Admin Portal</span></div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
        <div class="nav-section-label">Management</div>
        <a href="students.html" class="nav-link active"><i class="fas fa-user-graduate"></i> Students</a>
        <a href="companies.html" class="nav-link"><i class="fas fa-building"></i> Companies</a>
        <a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i> Reports</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar" id="sidebar-avatar">A</div><div><div class="user-name" id="sidebar-user-name">Admin</div><div class="user-role" id="sidebar-user-role">Admin</div></div></div>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="top-bar"><h1>Student Management</h1><div id="summary" style="font-size:.9rem;color:var(--text-muted);"></div></div>
      <div class="page-content">
        <div class="toolbar">
          <div class="search-box"><i class="fas fa-search"></i><input type="text" id="search" placeholder="Search by name, email, branch..."></div>
          <select id="filter-branch" class="form-control" style="width:150px;">
            <option value="">All Branches</option>
            <option>CSE</option><option>CSAI</option><option>IT</option><option>ECE</option><option>EEE</option><option>ME</option><option>CE</option><option>MCA</option><option>MBA</option>
          </select>
          <select id="filter-placed" class="form-control" style="width:160px;">
            <option value="">All Students</option>
            <option value="placed">Placed Only</option>
            <option value="unplaced">Unplaced Only</option>
          </select>
        </div>
        <div class="card">
          <div class="table-container">
            <table>
              <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Branch</th><th>CGPA</th><th>Backlogs</th><th>Grad Year</th><th>Profile</th><th>Placed</th></tr></thead>
              <tbody id="students-body"><tr><td colspan="9" style="text-align:center;color:var(--text-muted);">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/api.js"></script>
  <script>
    requireAuth('admin'); renderSidebarUser();
    let allStudents = [];

    const renderStudents = (students) => {
      const body = document.getElementById('students-body');
      if (!students.length) { body.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);">No students found.</td></tr>'; return; }
      body.innerHTML = students.map((s, i) => `<tr>
        <td>${i+1}</td>
        <td><strong>${s.user?.name||'—'}</strong></td>
        <td style="font-size:.82rem;">${s.user?.email||'—'}</td>
        <td>${s.branch||'—'}</td>
        <td>${s.cgpa??'—'}</td>
        <td>${s.activeBacklogs??'—'}</td>
        <td>${s.graduationYear||'—'}</td>
        <td>${s.profileComplete ? '<span class="badge badge-success">Complete</span>' : '<span class="badge badge-warning">Incomplete</span>'}</td>
        <td>${s.isPlaced ? '<span class="badge badge-success"><i class="fas fa-trophy"></i> Placed</span>' : '<span class="badge badge-secondary">No</span>'}</td>
      </tr>`).join('');
    };

    const filterStudents = () => {
      const q = document.getElementById('search').value.toLowerCase();
      const branch = document.getElementById('filter-branch').value;
      const placed = document.getElementById('filter-placed').value;
      const filtered = allStudents.filter(s =>
        (!q || (s.user?.name||'').toLowerCase().includes(q) || (s.user?.email||'').toLowerCase().includes(q) || (s.branch||'').toLowerCase().includes(q)) &&
        (!branch || s.branch === branch) &&
        (!placed || (placed === 'placed' ? s.isPlaced : !s.isPlaced))
      );
      document.getElementById('summary').textContent = `${filtered.length} student${filtered.length!==1?'s':''} · ${filtered.filter(s=>s.isPlaced).length} placed`;
      renderStudents(filtered);
    };

    (async () => {
      showLoading();
      try { const { data } = await api('/students'); allStudents = data; filterStudents(); } catch(e) { showToast(e.message,'error'); }
      hideLoading();
    })();

    document.getElementById('search').addEventListener('input', filterStudents);
    document.getElementById('filter-branch').addEventListener('change', filterStudents);
    document.getElementById('filter-placed').addEventListener('change', filterStudents);
  </script>
</body>
</html>
