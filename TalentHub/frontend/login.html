<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – TalentHub</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <h1>TalentHub</h1>
        <p>Campus Placement Management System</p>
      </div>
      <div id="alert-container"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-auth"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      </form>
      <div class="auth-links">
        Don't have an account? <a href="register.html">Register here</a>
        <br><br>
        <small style="color:#95a5a6;">Demo: rahul@student.edu / password123</small>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    redirectIfLoggedIn();
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-container');
      alertBox.innerHTML = '';
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      try {
        const { data } = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
        setAuth(data.token, data.user);
        if (data.user.role === 'student') window.location.href = '/student/dashboard.html';
        else if (data.user.role === 'company') window.location.href = '/company/dashboard.html';
        else window.location.href = '/admin/dashboard.html';
      } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${err.message}</div>`;
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    });
  </script>
</body>
</html>
