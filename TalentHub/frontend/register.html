<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – TalentHub</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
        <h1>Create Account</h1>
        <p>Join TalentHub today</p>
      </div>
      <div id="alert-container"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Your full name" required minlength="2">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Password <small style="color:#95a5a6;">(min 6 characters)</small></label>
          <input type="password" id="password" class="form-control" placeholder="Create a password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Register as</label>
          <div class="role-selector">
            <button type="button" class="role-btn active" data-role="student">
              <i class="fas fa-user-graduate"></i>Student
            </button>
            <button type="button" class="role-btn" data-role="company">
              <i class="fas fa-building"></i>Company
            </button>
            <button type="button" class="role-btn" data-role="admin">
              <i class="fas fa-shield-alt"></i>Admin
            </button>
          </div>
          <input type="hidden" id="role" value="student">
        </div>
        <button type="submit" class="btn-auth"><i class="fas fa-user-plus"></i> Create Account</button>
      </form>
      <div class="auth-links">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script>
    redirectIfLoggedIn();

    // Check URL param for pre-select
    const urlRole = new URLSearchParams(window.location.search).get('role');
    if (urlRole) {
      document.querySelectorAll('.role-btn').forEach(b => { b.classList.toggle('active', b.dataset.role === urlRole); });
      document.getElementById('role').value = urlRole;
    }

    document.querySelectorAll('.role-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('role').value = btn.dataset.role;
      });
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('alert-container');
      alertBox.innerHTML = '';
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
      try {
        const { data } = await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name: document.getElementById('name').value, email: document.getElementById('email').value, password: document.getElementById('password').value, role: document.getElementById('role').value }),
        });
        setAuth(data.token, data.user);
        if (data.user.role === 'student') window.location.href = '/student/dashboard.html';
        else if (data.user.role === 'company') window.location.href = '/company/dashboard.html';
        else window.location.href = '/admin/dashboard.html';
      } catch (err) {
        const msg = err.errors ? err.errors.map(e => e.message).join(', ') : err.message;
        alertBox.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${msg}</div>`;
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      }
    });
  </script>
</body>
</html>
