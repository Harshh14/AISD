<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers – TalentHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="spinner" class="spinner-overlay"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><h2><i class="fas fa-building"></i> TalentHub</h2><span>Company Portal</span></div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
        <div class="nav-section-label">Recruitment</div>
        <a href="jobs.html" class="nav-link"><i class="fas fa-briefcase"></i> Job Listings</a>
        <a href="applicants.html" class="nav-link"><i class="fas fa-users"></i> Applicants</a>
        <a href="interviews.html" class="nav-link"><i class="fas fa-calendar-check"></i> Interviews</a>
        <a href="offers.html" class="nav-link active"><i class="fas fa-file-contract"></i> Offers</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar" id="sidebar-avatar">C</div><div><div class="user-name" id="sidebar-user-name">Company</div><div class="user-role" id="sidebar-user-role">Company</div></div></div>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="top-bar">
        <h1>Offer Management</h1>
        <div class="top-bar-actions"><button class="btn btn-accent btn-sm" onclick="openIssueModal()"><i class="fas fa-plus"></i> Issue Offer</button></div>
      </div>
      <div class="page-content">
        <div class="card">
          <div class="table-container">
            <table>
              <thead><tr><th>Student</th><th>Job / Designation</th><th>CTC</th><th>Joining Date</th><th>Issued On</th><th>Status</th><th>Decision Date</th></tr></thead>
              <tbody id="offers-body"><tr><td colspan="7" style="text-align:center;color:var(--text-muted);">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Issue Offer Modal -->
  <div class="modal-overlay" id="offerModal">
    <div class="modal" style="max-width:560px;">
      <div class="modal-header"><h3><i class="fas fa-file-contract"></i> Issue Offer Letter</h3><button class="modal-close" onclick="closeModal('offerModal')">&times;</button></div>
      <div class="form-group"><label>Select Selected Applicant</label>
        <select id="offer-app-select" class="form-control"><option value="">Loading...</option></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="form-group"><label>Designation</label><input type="text" id="offer-designation" class="form-control" placeholder="Software Engineer"></div>
        <div class="form-group"><label>CTC (₹ per year)</label><input type="number" id="offer-ctc" class="form-control" placeholder="600000"></div>
        <div class="form-group"><label>Joining Date</label><input type="date" id="offer-joining" class="form-control"></div>
        <div class="form-group"><label>Offer Expiry Date</label><input type="date" id="offer-expiry" class="form-control"></div>
      </div>
      <div class="form-group"><label>Offer Location</label><input type="text" id="offer-location" class="form-control" placeholder="Hyderabad, Telangana"></div>
      <div class="form-group"><label>Additional Remarks</label><textarea id="offer-remarks" class="form-control" rows="2" placeholder="Relocation allowance included..."></textarea></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('offerModal')">Cancel</button>
        <button class="btn btn-primary" onclick="issueOffer()"><i class="fas fa-paper-plane"></i> Issue Offer</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    requireAuth('company'); renderSidebarUser();

    const loadOffers = async () => {
      showLoading();
      try {
        const { data } = await api('/offers/company');
        const body = document.getElementById('offers-body');
        if (!data.length) { body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);">No offers issued yet.</td></tr>'; return; }
        body.innerHTML = data.map(o => `<tr>
          <td><strong>${o.student?.user?.name||'—'}</strong><br><small style="color:var(--text-muted);">${o.student?.branch||''} · CGPA ${o.student?.cgpa||''}</small></td>
          <td>${o.designation||o.job?.title||'—'}</td>
          <td style="font-weight:700;color:var(--success);">${formatCTC(o.ctc)}</td>
          <td>${formatDate(o.joiningDate)}</td>
          <td>${formatDate(o.createdAt)}</td>
          <td>${statusBadge(o.status)}</td>
          <td>${o.studentDecisionAt ? formatDate(o.studentDecisionAt) : '—'}</td>
        </tr>`).join('');
      } catch(e) { showToast(e.message,'error'); }
      hideLoading();
    };
    loadOffers();

    const openIssueModal = async () => {
      const sel = document.getElementById('offer-app-select');
      sel.innerHTML = '<option value="">Loading...</option>';
      openModal('offerModal');
      try {
        const jobsRes = await api('/jobs/my');
        const opts = ['<option value="">Select Student (Selected status)</option>'];
        for (const j of jobsRes.data) {
          try {
            const r = await api(`/applications/job/${j.id}`);
            r.data.filter(a => a.status === 'Selected').forEach(a => {
              opts.push(`<option value="${a.id}">${a.student?.user?.name||'Student'} → ${j.title}</option>`);
            });
          } catch {}
        }
        sel.innerHTML = opts.join('');
      } catch(e) { showToast(e.message,'error'); }
    };

    const issueOffer = async () => {
      const appId = document.getElementById('offer-app-select').value;
      if (!appId) { showToast('Please select an applicant', 'error'); return; }
      try {
        await api('/offers', { method:'POST', body: JSON.stringify({
          applicationId: parseInt(appId),
          designation: document.getElementById('offer-designation').value,
          ctc: parseFloat(document.getElementById('offer-ctc').value)||0,
          joiningDate: document.getElementById('offer-joining').value||null,
          expiryDate: document.getElementById('offer-expiry').value||null,
          offerLocation: document.getElementById('offer-location').value,
          remarks: document.getElementById('offer-remarks').value,
        })});
        closeModal('offerModal'); showToast('Offer issued successfully!'); loadOffers();
      } catch(err) { showToast(err.message,'error'); }
    };
  </script>
</body>
</html>
