<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs – TalentHub</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="spinner" class="spinner-overlay"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><h2><i class="fas fa-graduation-cap"></i> TalentHub</h2><span>Student Portal</span></div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
        <a href="profile.html" class="nav-link"><i class="fas fa-user"></i> My Profile</a>
        <div class="nav-section-label">Placement</div>
        <a href="jobs.html" class="nav-link active"><i class="fas fa-briefcase"></i> Browse Jobs</a>
        <a href="applications.html" class="nav-link"><i class="fas fa-file-alt"></i> Applications</a>
        <a href="interviews.html" class="nav-link"><i class="fas fa-calendar-check"></i> Interviews</a>
        <a href="offers.html" class="nav-link"><i class="fas fa-file-contract"></i> Offers</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info"><div class="user-avatar" id="sidebar-avatar">S</div><div><div class="user-name" id="sidebar-user-name">Student</div><div class="user-role" id="sidebar-user-role">Student</div></div></div>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="top-bar"><h1>Browse Jobs</h1><div class="top-bar-actions"><span id="jobs-count" style="color:var(--text-muted); font-size:0.9rem;"></span></div></div>
      <div class="page-content">
        <div class="toolbar">
          <div class="search-box"><i class="fas fa-search"></i><input type="text" id="search" placeholder="Search jobs, companies..."></div>
          <select id="filter-type" class="form-control" style="width:160px;">
            <option value="">All Types</option>
            <option>Full-Time</option><option>Internship</option><option>Part-Time</option><option>Contract</option>
          </select>
          <select id="filter-eligible" class="form-control" style="width:160px;">
            <option value="">All Jobs</option>
            <option value="eligible">Eligible Only</option>
            <option value="ineligible">Ineligible</option>
          </select>
        </div>
        <div id="jobs-grid" class="jobs-grid"></div>
      </div>
    </main>
  </div>

  <!-- Apply Modal -->
  <div class="modal-overlay" id="applyModal">
    <div class="modal">
      <div class="modal-header"><h3><i class="fas fa-paper-plane"></i> Apply for Job</h3><button class="modal-close" onclick="closeModal('applyModal')">&times;</button></div>
      <div id="apply-job-info" style="background:var(--bg); border-radius:8px; padding:14px; margin-bottom:20px;"></div>
      <div class="form-group">
        <label>Cover Letter (optional)</label>
        <textarea id="coverLetter" class="form-control" rows="4" placeholder="Write a brief cover letter..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('applyModal')">Cancel</button>
        <button class="btn btn-primary" id="applyBtn"><i class="fas fa-paper-plane"></i> Submit Application</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    requireAuth('student');
    renderSidebarUser();
    let allJobs = [];
    let selectedJobId = null;

    const renderJobs = (jobs) => {
      const grid = document.getElementById('jobs-grid');
      if (!jobs.length) { grid.innerHTML = '<div class="card" style="text-align:center; color:var(--text-muted); padding:40px;"><i class="fas fa-briefcase" style="font-size:2rem;"></i><p style="margin-top:12px;">No jobs found.</p></div>'; return; }
      grid.innerHTML = jobs.map(job => {
        const elig = job.eligibility || {};
        const eligible = elig.isEligible !== false;
        job.eligibleBranches = parseArr(job.eligibleBranches);
        job.skills = parseArr(job.skills);
        return `<div class="job-card">
          <div class="job-card-header">
            <div>
              <div class="job-card h3" style="font-size:1rem; font-weight:700;">${job.title}</div>
              <div class="company-name" style="color:var(--text-muted); font-size:0.82rem;">${job.company?.companyName || 'Unknown'}</div>
            </div>
            <span class="badge badge-${job.jobType === 'Full-Time' ? 'primary' : 'info'}">${job.jobType}</span>
          </div>
          <div class="job-meta">
            <span><i class="fas fa-map-marker-alt"></i> ${job.location || 'Remote'}</span>
            <span><i class="fas fa-money-bill-wave"></i> ${job.salaryMin ? formatCTC(job.salaryMin) + '–' + formatCTC(job.salaryMax) : 'Not disclosed'}</span>
            <span><i class="fas fa-users"></i> ${job.openings} opening${job.openings > 1 ? 's' : ''}</span>
          </div>
          <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">
            <span><i class="fas fa-star"></i> Min CGPA: ${job.minCgpa}</span> &nbsp;·&nbsp;
            <span><i class="fas fa-ban"></i> Max Backlogs: ${job.maxBacklogs}</span>
          </div>
          <div class="eligibility-bar ${eligible ? 'eligible' : 'ineligible'}">
            <i class="fas fa-${eligible ? 'check-circle' : 'times-circle'}"></i>
            ${eligible ? 'You are eligible to apply' : (elig.reasons?.[0] || 'Not eligible')}
          </div>
          <div style="margin-top:12px; display:flex; gap:8px;">
            ${eligible
              ? `<button class="btn btn-primary btn-sm" onclick="openApply(${job.id},'${job.title.replace(/'/g,"\\'")}','${job.company?.companyName?.replace(/'/g,"\\'")||''}')"><i class="fas fa-paper-plane"></i> Apply</button>`
              : `<button class="btn btn-sm" style="background:var(--bg); color:var(--text-muted);" disabled>Not Eligible</button>`}
            ${job.applicationDeadline ? `<span style="font-size:0.75rem; color:var(--text-muted); align-self:center;">Deadline: ${formatDate(job.applicationDeadline)}</span>` : ''}
          </div>
        </div>`;
      }).join('');
    };

    const filterJobs = () => {
      const q = document.getElementById('search').value.toLowerCase();
      const type = document.getElementById('filter-type').value;
      const eligFilter = document.getElementById('filter-eligible').value;
      let filtered = allJobs.filter(j => {
        const matchQ = !q || j.title.toLowerCase().includes(q) || (j.company?.companyName || '').toLowerCase().includes(q) || (j.location || '').toLowerCase().includes(q);
        const matchType = !type || j.jobType === type;
        const matchElig = !eligFilter || (eligFilter === 'eligible' ? j.eligibility?.isEligible : !j.eligibility?.isEligible);
        return matchQ && matchType && matchElig;
      });
      document.getElementById('jobs-count').textContent = `${filtered.length} job${filtered.length !== 1 ? 's' : ''} found`;
      renderJobs(filtered);
    };

    (async () => {
      showLoading();
      try { const { data } = await api('/jobs'); allJobs = data; filterJobs(); } catch(e) { showToast(e.message,'error'); }
      hideLoading();
    })();

    document.getElementById('search').addEventListener('input', filterJobs);
    document.getElementById('filter-type').addEventListener('change', filterJobs);
    document.getElementById('filter-eligible').addEventListener('change', filterJobs);

    const openApply = (jobId, title, company) => {
      selectedJobId = jobId;
      document.getElementById('apply-job-info').innerHTML = `<strong>${title}</strong><br><span style="color:var(--text-muted); font-size:0.85rem;">${company}</span>`;
      document.getElementById('coverLetter').value = '';
      openModal('applyModal');
    };

    document.getElementById('applyBtn').addEventListener('click', async () => {
      const btn = document.getElementById('applyBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
      try {
        await api('/applications', { method: 'POST', body: JSON.stringify({ jobId: selectedJobId, coverLetter: document.getElementById('coverLetter').value }) });
        closeModal('applyModal');
        showToast('Application submitted successfully!');
      } catch(err) { showToast(err.message, 'error'); }
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Application';
    });
  </script>
</body>
</html>
