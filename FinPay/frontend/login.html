<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – FinPay Campus Wallet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand" style="justify-content: center; margin-bottom: 0.75rem;">FinPay</a>
        <h2>Sign In to FinPay</h2>
        <p>Access your student, merchant, or admin wallet portal</p>
      </div>

      <div id="alert-box" class="alert alert-danger" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Campus Email</label>
          <input type="email" id="email" class="form-control" placeholder="name@student.edu" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Don't have a student account? <a href="register.html">Sign Up</a>
      </div>

      <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-muted);">
        <strong>Demo Quick Logins:</strong><br>
        Student: <code>aarav@student.edu</code> / <code>Student@2024</code><br>
        Admin: <code>admin@finpay.edu</code> / <code>Admin@2024</code><br>
        Merchant: <code>canteen@finpay.edu</code> / <code>Merchant@2024</code>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
